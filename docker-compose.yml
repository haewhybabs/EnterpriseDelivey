services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: parcel_delivery
      POSTGRES_USER: parcel_app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
